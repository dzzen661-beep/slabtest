<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atelier Slab 3D</title>
    <style>
        :root {
            --bg-color: #121214;
            --panel-bg: #1a1a1e;
            --accent-color: #6366f1;
            --text-color: #f3f4f6;
            --border-color: #2e2e38;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Styles Holo Stage & Slab */
        .holo-stage {
            perspective: 1000px;
            width: 300px;
            height: 420px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
        }

        .holo-slab {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            background: #2a2a32;
        }

        .holo-ov {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            border-radius: 16px;
        }

        .holo-bar {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 15px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        /* Interface & Contrôles */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 90%;
            max-width: 400px;
            z-index: 10;
        }

        button, input[type="file"] {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .status {
            font-size: 0.9em;
            color: #9ca3af;
            text-align: center;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="holo-stage">
        <div class="holo-slab" id="slab">
            <canvas id="cardCanvas" width="300" height="420" style="border-radius: 16px;"></canvas>
            <div class="holo-ov"></div>
            <div class="holo-bar">
                <span id="cardName" style="font-weight: bold; font-size: 1.1em;">---</span>
                <span id="cardDetails" style="font-size: 0.85em; color: #aaa;">Jeu / Langue</span>
            </div>
        </div>
    </div>

    <div class="controls">
        <input type="file" id="imageInput" accept="image/*">
        <div
